seed: 42
device: cuda:0
num_steps_per_env: 64
max_iterations: 300
empirical_normalization: null
obs_groups: {}
clip_actions: null
save_interval: 25
experiment_name: nn_drive_fixed_stance
run_name: range_gru_stage1
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCriticRecurrent
  init_noise_std: 0.3
  noise_std_type: log
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 64
  - 64
  critic_hidden_dims:
  - 128
  - 128
  activation: relu
  rnn_type: gru
  rnn_hidden_dim: 64
  rnn_num_layers: 1
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 4
  learning_rate: 0.0005
  schedule: adaptive
  gamma: 0.998
  lam: 0.95
  entropy_coef: 0.002
  desired_kl: 0.01
  max_grad_norm: 0.5
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: true
  rnd_cfg: null
  symmetry_cfg: null
action_std_floor:
- 0.15
- 0.15
